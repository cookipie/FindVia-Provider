<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102c26" />
    <meta name="build-version" content="2026.10.22.9" />
    <link rel="icon" type="image/svg+xml" href="./findvia-provider.svg" />
    <meta name="description" content="FindVia Provider helps service professionals manage job requests, offers and earnings." />
    <title>FindVia Provider</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f5f7f5;color:#1d2d29;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .startup{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      .startup-card{width:min(100%,480px);padding:24px;box-sizing:border-box;border:1px solid #e1e8e3;border-radius:20px;background:white}
      .startup-wordmark{font:800 clamp(34px,7vw,46px)/1.1 system-ui,sans-serif;letter-spacing:-2px;color:transparent;-webkit-text-stroke:1.25px #176b50;stroke-dasharray:220;stroke-dashoffset:220;animation:letter-draw 1.5s ease forwards,letter-fill .45s ease 1.25s forwards}
      .startup-progress{width:min(220px,70vw);height:4px;overflow:hidden;border-radius:99px;background:#e3eee6;margin:14px auto 4px}
      .startup-progress span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#176b50,#64bd8d);animation:progress 1.15s ease-in-out infinite}
      .startup h1{font-size:24px;margin:14px 0 8px}
      .startup p{line-height:1.6;color:#56645d}
      .startup-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#176b50;margin-right:8px;animation:pulse 1s infinite alternate}
      @keyframes pulse{to{opacity:.25}}
      @keyframes letter-draw{to{stroke-dashoffset:0}}
      @keyframes letter-fill{to{color:#176b50;-webkit-text-stroke-color:transparent}}
      @keyframes progress{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @media(prefers-reduced-motion:reduce){.startup-wordmark,.startup-progress span,.startup-dot{animation:none}.startup-wordmark{color:#176b50;-webkit-text-stroke-color:transparent}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup">
        <section class="startup-card">
          <img src="./findvia-provider.svg" alt="FindVia Provider logo" style="display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 14px;border-radius:24px" />
          <h1>FindVia Provider</h1>
          <div class="startup-progress" aria-hidden="true"><span></span></div>
          <p><span class="startup-dot"></span>Opening your workspace…</p>
          <p id="startup-help" hidden>The app script did not start. Refresh this page once. If it stays here, send a screenshot to the app team.</p>
        </section>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var help = document.getElementById("startup-help");
        if (help && document.getElementById("root") && document.getElementById("root").querySelector(".startup")) {
          help.hidden = false;
        }
      }, 8000);
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (root && root.querySelector(".startup")) {
          root.innerHTML = '<main class="startup"><section class="startup-card"><div class="startup-brand">FINDVIA · PROVIDER</div><h1>Preview failed to load</h1><p>The app files did not load correctly. Refresh once, then share this screen if the problem continues.</p></section></main>';
        }
        console.error("FindVia Provider asset error:", event.message || event.type);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
