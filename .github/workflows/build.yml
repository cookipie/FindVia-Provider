name: Build and publish Provider App preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://bjaepfedteedkntwgnmy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Add fallback page for static hosting
        run: cp dist/index.html dist/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://bjaepfedteedkntwgnmy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app into Android project
        run: npx cap sync android
      - name: Apply FindVia launcher icon
        run: |
          npm install --no-save sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          const sizes = [['mdpi',48],['hdpi',72],['xhdpi',96],['xxhdpi',144],['xxxhdpi',192]];
          for (const [density,size] of sizes) {
            const dir = `android/app/src/main/res/mipmap-${density}`;
            await mkdir(dir,{recursive:true});
            for (const name of ['ic_launcher.png','ic_launcher_round.png']) {
              await sharp('public/findvia-provider.svg').resize(size,size).png().toFile(`${dir}/${name}`);
            }
          }
          NODE
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: findvia-provider-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provider-test-latest
          name: FindVia Provider – latest testing APK
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
